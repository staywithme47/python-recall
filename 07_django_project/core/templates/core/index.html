{% extends 'core/base.html' %}
{% block content %}
    <h2> Активы на бирже </h2>
    <ul class="list-group">
        {% for asset in assets%}
        <li class="list-group-item">
            <a href="{% url 'asset_detail' asset.id%}">
                {{ asset.name }}
            </a>
            стоит {{ asset.price }}
        </li>
        {%endfor%}
    </ul>

    <h2> Добавить актив</h2>
    <div class="card p-3 mt-4">
        <form method = "POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success mt-3">Сохранить</button>
        </form>
    </div>
{% endblock %}
