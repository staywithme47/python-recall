<!DOCTYPE html>
<html lang = "ru">
<head>
    <meta charset="UTF-8">
    <title>Моя биржа</title>
</head>

<body>
    <h1> Привет, {{username}}! </h1>
    <p> Это мой первый шаблон в Django. </p>


    <h2> Активы на бирже </h2>
    <ul>
        {% for asset in assets%}
        <li>
            <a href="{% url 'asset_detail' asset.id%}">
                {{ asset.name }}
            </a>
            стоит {{ asset.price }}
        </li>
        {%endfor%}
    </ul>

    <h2> Добавить актив</h2>
    <form method = "POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
</body>
</html>
