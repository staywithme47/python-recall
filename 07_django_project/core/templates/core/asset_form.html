<!DOCTYPE html>
<html>
    <head><title>Редактирование</title></head>
<body>
        <h1>Редактировать актив: {{ asset.name }}</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Сохранить изменения</button>
        </form>
    <br>
    <a href="{% url 'asset_detail' asset.id %}">Отмена</a>
</body>
</html>
