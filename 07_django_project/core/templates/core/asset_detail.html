{% extends 'core/base.html'%}

{% block content%}
    <body>
    <div class="card mt-4" style="max-width: 400px;">
        <div class="card-body">
            <h1>Актив: {{ asset.name }}</h1>
            <p>Текущая цена: {{ asset.price }}$</p>
                <a href="{% url 'asset_update' asset.id %}" class="btn btn-warning">Редактировать</a>
            <form action="{% url 'asset_delete' asset.id %}" method="POST" style="display:inline;">
                {% csrf_token %}
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Вы уверены, что хотите удалить этот актив?');">Удалить</button>
            </form>
            <a href="{% url 'index' %}">← Назад на главную</a>
        </div>
    </div>
    </body>
{%endblock%}
